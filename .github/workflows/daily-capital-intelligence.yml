name: Daily Global Capital Intelligence

on:
  schedule:
    # Monday 07:06 Asia/Shanghai = Sunday 23:06 UTC
    - cron: '6 23 * * 0'
    # Thursday 23:08 Asia/Shanghai = Thursday 15:08 UTC
    - cron: '8 15 * * 4'
  workflow_dispatch:
    inputs:
      cycle:
        description: "Manual search cycle"
        required: true
        type: choice
        options:
          - monday
          - thursday
        default: monday

permissions:
  contents: write

concurrency:
  group: daily-global-capital-intelligence
  cancel-in-progress: false

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate and send report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PYTHONPATH: src
          SEARCH_CYCLE: ${{ github.event_name == 'schedule' && (github.event.schedule == '6 23 * * 0' && 'monday' || 'thursday') || inputs.cycle || 'monday' }}
        run: python src/run.py
      - name: Persist weekly searched-site history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/search_site_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Update weekly searched-site history"
            git push
          fi
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-capital-intelligence-${{ github.run_id }}
          path: data/reports/
          if-no-files-found: ignore
          retention-days: 30
